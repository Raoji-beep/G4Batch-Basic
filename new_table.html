<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Table</title>
</head>
<body>
    <h1>Class Schedule</h1>
    <table border = "1" cellpadding = "10" cellspacing = "10">

        <thead>
            <th>Day</th>
            <th>Time</th>
            <th>Subject</th>
        </thead>
        <tbody>
            <tr>
                <td colspan="3">Monday</td>
                <td>9:00 AM - 10:00 AM</td>
                <td>Math</td>
            </tr>
            <tr>
                <td>Tuesday</td>
                <td>10:00 AM - 11:00 AM</td>
                <td>Science</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td>11:00 AM - 12:00 PM</td>
                <td>History</td>
            </tr>
            <tr>
                <td>Thursday</td>
                <td>12:00 PM - 1:00 PM</td>
                <td>Geography</td>
            </tr>
            <tr>
                <td>Friday</td>
                <td>1:00 PM - 2:00 PM</td>
                <td>English</td>
            </tr>
    </table>
</body>
</html>
